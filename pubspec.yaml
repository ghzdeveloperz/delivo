name: delivo
description: "Excluir fotos com facilidade."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.2.1
  photo_manager: ^3.12.0
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/brand/
    - assets/icons/app/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400

        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500

        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app/app_icon.png"
  remove_alpha_ios: true
