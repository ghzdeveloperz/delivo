name: delivo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  photo_manager: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400

        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500 

        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
